name: Build and deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Deploy dist to production server
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 157.180.46.18 >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -p 22" dist/ root@157.180.46.18:/var/www/manage.apnakharcha.in/
